id: GO-2026-7011
modules:
    - module: github.com/altcha-org/altcha-lib-go
      vulnerable_at: 1.0.0
      packages:
        - package: github.com/altcha-org/altcha-lib-go
          symbols:
            - parseServerSignature
          derived_symbols:
            - VerifyServerSignature
            - VerifyServerSignatureSafe
summary: |-
    Nil-map panic in parseServerSignature on malformed VerificationData in
    github.com/altcha-org/altcha-lib-go
description: |-
    In v1 of github.com/altcha-org/altcha-lib-go, parseServerSignature only
    initializes ServerSignatureVerificationData.Extra when url.ParseQuery returns a
    nil error. Because url.ParseQuery returns partial results alongside a non-nil
    error on malformed percent-escapes, a crafted VerificationData value triggers a
    nil-map write panic before signature verification is performed.

    The v2 module (github.com/altcha-org/altcha-lib-go/v2) is not affected.
