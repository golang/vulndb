summary: Apply ReadHeaderTimeout when doing unencrypted HTTP/2 check in net/http
description: |
    When a server is configured to support unencrypted HTTP/2, it reads a
    few bytes from each new connection to see if they contain the HTTP/2
    client preface. ReadHeaderTimeout is unexpectedly not being applied
    when doing this.
