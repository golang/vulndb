id: GO-2026-6911
modules:
    - module: github.com/mark3labs/mcp-go
      versions:
        - fixed: 1.5.1-0.20261109144041-2f5b9637ea84
      vulnerable_at: 1.5.0
      packages:
        - package: github.com/mark3labs/mcp-go/client/transport
          symbols:
            - NewOAuthHandler
            - NewSSE
            - NewStreamableHTTP
            - OAuthHandler.ProcessAuthorizationResponse
            - OAuthHandler.RefreshToken
            - OAuthHandler.RegisterClient
            - SSE.SendNotification
            - SSE.SendRequest
            - SSE.handleSSEEvent
            - StreamableHTTP.SendNotification
            - StreamableHTTP.SendRequest
          derived_symbols:
