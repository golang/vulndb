summary: |-
    SSRF and credential leak via unvalidated redirects and SSE endpoint origin in
    github.com/mark3labs/mcp-go
description: |-
    In github.com/mark3labs/mcp-go/client/transport, NewStreamableHTTP, NewSSE, and
    NewOAuthHandler construct default http.Client instances with a nil CheckRedirect
    policy when no custom HTTP client (WithHTTPBasicClient, WithHTTPClient, or
    OAuthConfig.HTTPClient) is supplied. Additionally, SSE.handleSSEEvent validates
    the server-supplied endpoint event URL only against the connection's host,
    without verifying the scheme or port.

    When an MCP or OAuth server responds with a 3xx redirect, net/http follows up to
    10 http or https redirects to arbitrary origins:
    - Custom headers configured via WithHTTPHeaders, WithHTTPHeaderFunc,
    WithHeaders, or WithHeaderFunc are copied onto requests to any redirect host.
    - The Authorization header (including OAuth bearer tokens) is preserved when
    redirecting to the same host or a subdomain, including across port changes or
    https-to-http scheme downgrades.
    - On 307 and 308 redirects, the request body is resent to the redirect target,
    exposing JSON-RPC payloads on transport requests and form bodies containing
    client_secret, authorization codes, or refresh tokens on OAuth token, refresh,
    and client registration requests.

    This enables server-side request forgery (SSRF) and credential or payload
    disclosure.
