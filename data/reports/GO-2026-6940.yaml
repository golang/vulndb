summary: Unbounded allocation from peer-declared frame length in github.com/gobwas/ws
description: |-
    ws.ReadFrame, ws.MustReadFrame, and the wsutil message readers allocate a
    buffer of the payload length declared in the frame header before reading any
    payload bytes. A remote unauthenticated peer can send a frame header
    declaring a large payload length and cause an out-of-memory crash.
