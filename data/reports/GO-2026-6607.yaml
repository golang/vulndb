id: GO-2026-6607
modules:
    - module: std
      versions:
        - fixed: 1.26.9
        - introduced: 1.27.0-0
        - fixed: 1.27.2
      vulnerable_at: 1.27.1
      packages:
        - package: crypto/tls
          symbols:
            - decodeInnerClientHello
          derived_symbols:
            - Conn.Handshake
            - Conn.HandshakeContext
            - Conn.Read
            - Conn.Write
            - Dial
            - DialWithDialer
            - Dialer.Dial
            - Dialer.DialContext
            - QUICConn.Start
summary: Reject malformed ECH outer extension references in crypto/tls
description: |-
    Multiple ECH outer extension references are not
    permitted under RFC 9849; previously, a client
    could send a well-crafted packet that could
    trigger memory exhaustion in the server process
    by specifying multiple references.

    We now reject these as malformed and curb the
    memory amplification vector as a result.
references:
