summary: Race condition in 'docker cp' in github.com/docker/docker allows bind mount redirection
description: |-
    A race condition in the Docker daemon allows an attacker to redirect bind
    mounts to arbitrary host paths during a "docker cp" operation.

    The affected code is in the daemon package, specifically the openContainerFS
    method. This is daemon-owned, Linux-specific code and is not intended for
    external use as a Go library.
