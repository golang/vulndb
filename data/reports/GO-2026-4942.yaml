      packages:
        - package: github.com/distribution/distribution/v3/registry/storage/cache/redis
          symbols:
            - repositoryScopedRedisBlobDescriptorService.Clear
summary: Stale blob descriptor cache invalidation in github.com/distribution/distribution
description: |-
    In github.com/distribution/distribution and
    github.com/distribution/distribution/v3 before 3.1.0, when
    storage.cache.blobdescriptor is configured with redis and storage.delete.enabled
    is true, deleting a blob in one repository clears the shared digest descriptor
    in Redis but leaves stale repository-scoped membership behind. If another
    repository subsequently requests or stats the same digest, the shared descriptor
    is repopulated and the deleted blob becomes accessible again in the first
    repository.
