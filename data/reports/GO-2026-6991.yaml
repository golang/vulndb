          symbols:
            - ProfileReconciler.limitReferencesToNamespace
          derived_symbols:
            - ProfileReconciler.Reconcile
summary: Profile namespace restriction bypass in github.com/projectsveltos/addon-controller
description: |-
    ProfileReconciler does not restrict the namespace of
    spec.helmCharts[].valuesFrom, spec.patchesFrom, or spec.templateResourceRefs to
    the Profile's own namespace when copying a namespace-scoped Profile into a
    ClusterSummary. A user permitted to create Profiles in one namespace can read
    ConfigMaps, Secrets, and other resources from arbitrary namespaces in the
    management cluster.
