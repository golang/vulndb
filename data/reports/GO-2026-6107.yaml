      versions:
        - fixed: 3.5.33
        - introduced: 3.6.0
        - fixed: 3.6.14
        - introduced: 3.7.0-alpha.0
        - fixed: 3.7.1
      vulnerable_at: 3.7.0
      packages:
        - package: go.etcd.io/etcd/client/pkg/v3/transport
          symbols:
            - tlsListener.acceptLoop
            - NewTLSListener
          derived_symbols:
            - NewListener
            - NewListenerWithOpts
            - NewTimeoutListener
summary: Unbounded TLS handshake goroutines in go.etcd.io/etcd/client/pkg/v3
description: |-
    In go.etcd.io/etcd/client/pkg/v3 before 3.5.33, 3.6.14, and 3.7.1, TLS
    handshakes on listeners created by NewTLSListener do not enforce a handshake
    deadline. An unauthenticated network attacker who connects to an etcd TLS
    listener without sending a ClientHello causes a goroutine and a tracking map
    entry to block indefinitely. Opening many such connections exhausts memory,
    leading to a denial of service.
