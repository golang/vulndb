id: GO-2025-3547
modules:
    - module: k8s.io/kubernetes
      versions:
        - introduced: 1.3.0
        - fixed: 1.37.0
      vulnerable_at: 1.32.3
summary: Namespace deletion can bypass network policies in k8s.io/kubernetes
description: |-
    During namespace termination, network policy resources can be deleted before
    the Pods they protect, allowing the remaining Pods to bypass those policies.

    OrderedNamespaceDeletion is enabled by default in Kubernetes 1.33 and became
    GA in 1.34. Earlier releases still retain a feature gate whose behavior can
    follow an older emulated version. Kubernetes 1.37 removes that gate and
    unconditionally deletes Pods and waits for their termination before deleting
    other namespace resources.
