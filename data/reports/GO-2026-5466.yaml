summary: Unauthenticated backend instantiation in github.com/rclone/rclone
description: |-
    The operations/fsinfo remote control (RC) endpoint in rclone was registered
    without requiring authentication. This allowed unauthenticated callers to
    instantiate arbitrary backends via inline backend definitions, which could lead
    to local command execution if the backend configuration allows it (e.g., via
    bearer_token_command in webdav or ssh in sftp).
