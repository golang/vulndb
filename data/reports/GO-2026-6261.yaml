summary: |-
    Dgraph Alpha group stores can be replaced via unauthenticated external snapshot
    import in github.com/dgraph-io/dgraph
description: |-
    Dgraph Alpha exposes the RPCs used for external snapshot import on the public
    gRPC port without authentication or authorization. An unauthenticated network
    client can call StreamExtSnapshot and send Badger stream data to replace a
    target group's store, which drops and replaces the existing database data.
