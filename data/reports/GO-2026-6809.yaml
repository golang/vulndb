id: GO-2026-6809
modules:
    - module: std
      versions:
        - fixed: 1.26.10
        - introduced: 1.27.0-0
        - fixed: 1.27.3
      vulnerable_at: 1.27.2
      packages:
        - package: crypto/x509
          symbols:
            - Certificate.Verify
summary: Distrust compromised intermediate certificates in crypto/x509
description: |-
    On most platforms, Go uses the given system root certificates.
    However, in some narrower cases, the system trust stores may
    not be updated without further action.

    To defend against the narrower set of cases that may remain affected,
    a denylist was added in crypto/x509 to return an error when calling
    Verify with any of the known intermediate certificates that are no longer
    considered to be trustworthy.
references:
