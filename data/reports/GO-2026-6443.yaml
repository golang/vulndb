summary: Server panic via missing authority or Host headers in google.golang.org/grpc
description: |-
    In google.golang.org/grpc, servers configured with xDS routing can panic when
    processing requests that lack both :authority and Host headers. The HTTP/2
    transport layer accepted requests missing these headers, and the xDS server
    routing interceptor attempted to index the empty authority slice, causing an
    unhandled panic and terminating the server.
