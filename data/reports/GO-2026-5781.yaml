id: GO-2026-5781
modules:
    - module: rsc.io/pdf
      vulnerable_at: 0.1.1
      packages:
        - package: rsc.io/pdf
          symbols:
            - Open
            - NewReader
          skip_fix: repository is archived
summary: Uncatchable stack-overflow denial of service in rsc.io/pdf
description: |-
    pdf.Open and PDF object resolution in rsc.io/pdf recurse without bound on
    nested arrays and dictionaries. A sufficiently deeply nested document exhausts
    the goroutine stack limit and triggers a fatal, uncatchable stack overflow.
    Any service that parses untrusted PDFs with rsc.io/pdf can therefore be taken
    down by a single small input.
credits:
