id: GO-2026-6441
modules:
    - module: google.golang.org/grpc
      versions:
        - fixed: 1.83.1
      vulnerable_at: 1.83.0
      packages:
        - package: google.golang.org/grpc/internal/xds/httpfilter/rbac
          symbols:
            - parseConfig
          derived_symbols:
            - builder.ParseFilterConfig
            - builder.ParseFilterConfigOverride
summary: Bypass of xDS RBAC HTTP filter header matching in google.golang.org/grpc
description: |-
    In google.golang.org/grpc, the xDS RBAC HTTP filter does not lowercase
    header matcher names before evaluating them against incoming request
    metadata. When an RBAC policy defines rules (such as DENY) referencing
    headers with uppercase or mixed-case characters, the rule fails to match,
    causing authorization policies to fail open. Additionally, callers can evade
    gRFC A41 validation blocking "grpc-" prefixed headers and ":scheme" via
    variations in casing.
