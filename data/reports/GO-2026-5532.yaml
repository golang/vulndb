summary: Authorization and Cookie headers forwarded to error page service in github.com/traefik/traefik
description: |-
    Traefik's errors middleware by default forwards all original request headers to
    the error page service. If the error page service is in a separate trust
    domain, this can lead to the disclosure of sensitive information such as
    Authorization or Cookie headers.

    The fix adds an errorRequestHeaders option to the Errors middleware,
    allowing users to explicitly list which headers should be forwarded.
