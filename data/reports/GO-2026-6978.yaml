      versions:
        - fixed: 1.0.2
      vulnerable_at: 1.0.1
      packages:
        - package: github.com/mikehelmick/go-bananas/middleware
          symbols:
            - MutateMethod
summary: CSRF protection bypass via _method override in github.com/mikehelmick/go-bananas
description: |-
    middleware.MutateMethod accepts a _method override from the query string or
    request body and allows overriding the HTTP method to safe methods such as GET.
    When installed as router middleware ahead of middleware.HandleCSRF, a cross-site
    POST request with _method=GET is routed to the POST handler while HandleCSRF
    observes a GET request and skips CSRF token validation.
