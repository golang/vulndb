summary: |-
    Nil pointer dereference in Infinite Scale TUS uploads in
    github.com/rclone/rclone
description: |-
    During WebDAV Infinite Scale TUS upload creation, a transport failure can return
    a nil HTTP response along with an error. When handling the failure, rclone
    dereferences the nil response before checking the error, causing a panic that
    can crash the process in unrecovered contexts such as VFS mounts.
