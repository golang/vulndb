summary: Unbounded memory allocation via streaming row reader in github.com/xuri/excelize
description: |-
    In github.com/xuri/excelize/v2, the streaming worksheet reader used by Rows and
    GetRows does not enforce the maximum row limit (TotalRows) on row "r"
    attributes. A crafted spreadsheet with an out-of-bounds row index causes
    GetRows to allocate empty row slices up to the specified row number, leading to
    excessive memory consumption and denial of service.
