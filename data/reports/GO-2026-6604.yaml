summary: Root.Mkdir(All) can follow junctions out of the root on Windows in os
description: |-
    On Windows, when the target of Root.Mkdir or Root.MkdirAll is a junction
    pointing to an empty location, the operation can create a directory at
    the junction target even when that target is located outside the root.
    This only applies to operations where the last path component is a
    junction (path/to/junction, but not path/junction/target).
