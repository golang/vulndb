id: GO-2026-6165
modules:
    - module: github.com/pion/dtls/v3
      versions:
        - fixed: 3.1.4
      vulnerable_at: 3.1.3
      packages:
        - package: github.com/pion/dtls/v3/pkg/protocol/handshake
          symbols:
            - MessageServerKeyExchange.Unmarshal
          derived_symbols:
            - Handshake.Unmarshal
summary: Panic while parsing crafted ECDHE_PSK ServerKeyExchange in github.com/pion/dtls/v3
description: |-
    In github.com/pion/dtls/v3 before 3.1.4, MessageServerKeyExchange.Unmarshal
    does not verify that data remains after parsing the PSK identity hint when
    handling ECDHE_PSK key exchange messages. A remote peer sending a crafted
    ServerKeyExchange message where the PSK hint consumes all remaining data
    triggers an index out of range runtime panic, causing a denial of service.
