summary: Integer overflow in Avro decoder in github.com/iskorotkov/avro/v2 and github.com/hamba/avro/v2
description: |-
    Several Avro decoder paths read attacker-controlled 64-bit values from the wire
    format and either narrowed them to platform-sized int before bounds-checking,
    or summed them with overflow-prone signed-int arithmetic. On 32-bit targets,
    the truncation paths can silently bypass byte-slice limits, select the wrong
    union branch, or hit a negative-make panic via wrap.

    Three sub-issues are not 32-bit-specific: cumulative-size arithmetic overflow
    in array and map decoders, negation of MinInt in block-header handling, and
    negative size in block reads. All three panic or bypass caps on any platform,
    giving an attacker a denial-of-service primitive. Exploitation requires only
    an untrusted Avro stream.
