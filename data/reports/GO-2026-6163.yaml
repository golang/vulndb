summary: Panic on malformed XOR-MAPPED-ADDRESS attribute in github.com/pion/stun/v3
description: |-
    In github.com/pion/stun/v3 before 3.1.5, XORMappedAddress.GetFromAs reads
    the address family header from an XOR-MAPPED-ADDRESS attribute before
    validating the attribute length. Parsing a malformed STUN message carrying a
    zero-length XOR-MAPPED-ADDRESS attribute from a tightly sized buffer causes
    a slice bounds out of range panic, resulting in a denial of service.
