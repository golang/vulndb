summary: CPU exhaustion in Avro decoder in github.com/iskorotkov/avro/v2 and github.com/hamba/avro/v2
description: |-
    The Avro array and map decoders loop over an attacker-controlled block-count
    value without checking the underlying reader's error state inside the loop body.
    Reader.ReadBlockHeader returns the count as a Go int, which is 64-bit on
    amd64 and arm64 targets. A producer can declare a block of up to
    math.MaxInt64 elements followed by EOF or any truncated payload, and the
    decoder will attempt that many no-op iterations before propagating the error.

    The realistic ceiling is indefinite until the worker is killed externally. A
    single hostile payload pins a CPU core until the process is OOM-killed,
    deadline-cancelled, or terminated, resulting in a remote, unauthenticated
    denial-of-service.

    The fix exits the loop on the first inner-decode error.
