            - UnevaluatedProperties.ValidateKeyword
summary: |-
    Bypass of additionalProperties validation via nested object property names in
    github.com/qri-io/jsonschema
description: |-
    In github.com/qri-io/jsonschema, Properties.ValidateKeyword,
    PatternProperties.ValidateKeyword, and AdditionalProperties.ValidateKeyword call
    currentState.UpdateEvaluatedPropsAndItems(subState) after validating nested
    object properties, merging the child object's evaluated property names into the
    parent object's validation state. Consequently, any property on the parent
    object that shares a name with a validated property in a nested child object is
    treated as already evaluated on the parent, bypassing additionalProperties and
    unevaluatedProperties validation on the parent object.
