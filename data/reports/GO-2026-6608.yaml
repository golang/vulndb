id: GO-2026-6608
modules:
    - module: std
      versions:
        - fixed: 1.26.9
        - introduced: 1.27.0-0
        - fixed: 1.27.2
      vulnerable_at: 1.27.1
      packages:
        - package: net/textproto
          symbols:
            - readMIMEHeader
            - Reader.readContinuedLineSlice
          derived_symbols:
            - Reader.ReadContinuedLine
            - Reader.ReadContinuedLineBytes
            - Reader.ReadMIMEHeader
        - package: mime/multipart
          symbols:
            - Part.populateHeaders
            - Reader.readForm
          derived_symbols:
            - Reader.NextPart
            - Reader.NextRawPart
            - Reader.ReadForm
summary: Memory limit bypass when parsing MIME headers in net/textproto, mime/multipart
description: |-
    Parsing a multipart form can bypass memory limits and read an
    arbitrarily long line into memory when the remaining limit at the
    start of a part is less than 400 bytes.
