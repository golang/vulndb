summary: Unauthenticated command execution in rclone rcd via inline remotes in github.com/rclone/rclone
description: |-
    The --rc-serve path in rclone allows unauthenticated remote instantiation,
    enabling unauthenticated command execution. An attacker can use inline
    remote backend options such as sftp ssh to run arbitrary commands as the
    rclone user.
