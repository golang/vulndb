id: GO-2026-6600
modules:
    - module: std
      versions:
        - fixed: 1.26.9
        - introduced: 1.27.0-0
        - fixed: 1.27.2
      vulnerable_at: 1.27.1
      packages:
        - package: html/template
          symbols:
            - nextJSCtx
            - tJS
          derived_symbols:
            - Template.Execute
            - Template.ExecuteTemplate
summary: Recognize yield as regexp preceder keyword in html/template
description: |-
    A trusted template author may have previously written a valid template wherein
    the use of the 'yield' keyword would not be correctly escaped.

    We now ensure that valid keyword uses are escaped and non-keyword uses are not
    escaped.
