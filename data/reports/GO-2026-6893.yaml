      versions:
        - fixed: 0.0.3-0.20261001001437-1991f15bc4b0
      vulnerable_at: 0.0.2
      packages:
        - package: github.com/google/go-eventlog/tcg
          symbols:
            - Event.UntrustedType
          derived_symbols:
            - ConvertToPbEvents
summary: Event type spoofing via UntrustedType in github.com/google/go-eventlog
description: |-
    In github.com/google/go-eventlog/tcg, Event exposes UntrustedType, which returns
    the raw event type header from the TCG event log without verifying that the
    event data matches its digest. Callers that dispatch on Event.UntrustedType
    after ParseAndReplay can be tricked by a modified event type field for events
    whose digests are not verified against EventData.
