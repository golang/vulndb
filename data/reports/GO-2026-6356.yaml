summary: Missing authorization on vttablet /debug/vrlog in vitess.io/vitess
description: |-
    The vttablet /debug/vrlog HTTP endpoint streams live VReplication event data,
    including SQL statements and table row changes, without verifying
    authorization via acl.CheckAccessHTTP. An unauthenticated actor with network
    access to the debug endpoint can stream live replicated SQL data.
