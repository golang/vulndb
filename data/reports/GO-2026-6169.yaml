      versions:
        - introduced: 1.11.0
      vulnerable_at: 1.12.3
      packages:
        - package: github.com/lib/pq
          symbols:
            - Connector.Connect
            - DialOpen
            - Driver.Open
            - Open
          derived_symbols:
            - NewDialListener
            - NewListener
            - NewListenerConn
summary: |-
    WITHDRAWN: Disclosure of wrong .pgpass credential via hostaddr in
    github.com/lib/pq
description: |-
    (This report has been withdrawn with reason: "False positive"). When a
    connection specifies hostaddr without host, github.com/lib/pq dials the numeric
    hostaddr but performs .pgpass lookup using the default Config.Host value,
    localhost. If the passfile contains different credentials for localhost and the
    remote address, the driver selects the secret intended for the local database
    and sends it to the remote endpoint when that endpoint requests password
    authentication.
