summary: |-
    Traefik: HTTP/3 mTLS bypass via exact SNI TLSOptions lookup for wildcard and
    mixed-case hosts in github.com/traefik/traefik
description: |-
    Traefik's HTTP/3 TLS configuration selection is vulnerable to a bypass when
    using wildcard or mixed-case hosts in the SNI.

    The HTTP/3 (QUIC) path performed a direct, case-sensitive lookup on the SNI
    value to select the applicable TLS configuration. This lookup failed to
    match wildcard host patterns (e.g., "*.example.com") or case variants of
    configured hostnames. In these cases, Traefik would fall back to the default
    TLS configuration, which might not enforce mutual TLS (mTLS), allowing
    unauthenticated clients to access protected backends.
