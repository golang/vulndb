summary: |-
    Unauthenticated restoreTenant mutation allows database overwrite and SSRF in
    github.com/dgraph-io/dgraph
description: |-
    The restoreTenant GraphQL mutation in Dgraph was missing from the admin mutation
    middleware configuration. This omission bypassed all authentication, IP
    whitelisting, and audit logging for this mutation.

    An unauthenticated remote attacker could use this mutation to trigger a database
    restore from an arbitrary URL, potentially leading to a complete database
    overwrite, Server-Side Request Forgery (SSRF), or arbitrary file read on the
    host system.
