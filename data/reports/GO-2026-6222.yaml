id: GO-2026-6222
modules:
    - module: golang.org/x/image
      versions:
        - fixed: 0.45.0
      vulnerable_at: 0.44.0
      packages:
        - package: golang.org/x/image/vp8l
          symbols:
            - decoder.decodeHuffmanGroups
            - decoder.decodeHuffmanTree
          derived_symbols:
            - Decode
summary: Excessive memory allocation during VP8L decoding in golang.org/x/image
description: |
    VP8L decoding in golang.org/x/image/vp8l can allocate an excessive amount of
    memory when processing a crafted VP8L image containing many unused Huffman tree
    groups. This allows a remote attacker to cause a denial of service via memory
    exhaustion.
