id: GO-2026-6171
modules:
    - module: github.com/lib/pq
      versions:
        - introduced: 1.0.0
      vulnerable_at: 1.12.3
      packages:
        - package: github.com/lib/pq
          symbols:
            - Connector.Connect
            - DialOpen
            - Driver.Open
            - Open
            - rows.Next
          derived_symbols:
            - NewDialListener
            - NewListener
            - NewListenerConn
            - conn.Ping
            - rows.Close
summary: |-
    WITHDRAWN: Malformed RowDescription and DataRow messages cause panics in
    github.com/lib/pq
description: |-
    (This report has been withdrawn with reason: "Report mistakenly added without
    having CVE / GHSA associated"). github.com/lib/pq decodes attacker-controlled
    RowDescription and DataRow payloads without validating their structural
    relationship or encoded value widths required by binary decoders. A malicious
    PostgreSQL endpoint or active network attacker on an unauthenticated transport
    can send malformed row responses, causing unrecovered runtime panics while
    reading query results.
