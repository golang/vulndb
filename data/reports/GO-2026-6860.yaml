id: GO-2026-6860
modules:
    - module: golang.org/x/net
      versions:
        - fixed: 0.62.0
      vulnerable_at: 0.61.0
      packages:
        - package: golang.org/x/net/html
          symbols:
            - parser.addText
            - parser.fosterParent
            - parser.parse
          derived_symbols:
            - Parse
            - ParseFragment
            - ParseFragmentWithOptions
            - ParseWithOptions
summary: Avoid quadratic complexity when coalescing text nodes in html in golang.org/x/net
description: |-
    When coalescing adjacent text nodes in addText and fosterParent, appending to an
    existing TextNode's Data via string concatenation (n.Data += text) reallocated
    and copied the accumulated string on every token. Inputs containing many short
    text runs separated by ignored end tags (such as "a</x>") caused O(n^2)
    allocations and byte copies.

    Accumulate coalesced text in per-node byte slices during parsing and materialize
    Data strings once at the end of parse.
