id: GO-2026-5116
modules:
    - module: github.com/containers/buildah
      versions:
        - introduced: 1.38.1
      vulnerable_at: 1.43.1
summary: |-
    Build breakout using malicious Containerfile or Git HTTP server in
    github.com/containers/buildah
description: |-
    Buildah allows a build-time breakout when using a malicious Containerfile
    or a malicious Git HTTP server. A crafted Git URL or Containerfile can
    cause Buildah to access files outside of the build context during an
    ADD or COPY operation.
