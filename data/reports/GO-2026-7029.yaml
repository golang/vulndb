id: GO-2026-7029
modules:
    - module: github.com/emersion/go-smtp
      versions:
        - introduced: 0.15.0
        - fixed: 0.25.1
      vulnerable_at: 0.25.0
      packages:
        - package: github.com/emersion/go-smtp
          symbols:
            - Conn.handleBdat
          derived_symbols:
            - Server.ListenAndServe
            - Server.ListenAndServeTLS
            - Server.Serve
summary: Unbounded memory allocation during BDAT transaction in github.com/emersion/go-smtp
description: |-
    Conn.handleBdat disables the line length limit on the connection reader while
    reading a BDAT chunk and only restored it on error or on the final BDAT LAST
    chunk. A remote client that sends another command between two BDAT commands in
    a transaction bypasses Server.MaxLineLength, allowing unbounded memory
    allocation and denial of service.
