id: GO-2026-6179
modules:
    - module: cmd
      versions:
        - fixed: 1.25.13
        - introduced: 1.26.0-0
        - fixed: 1.26.6
        - introduced: 1.27.0-0
        - fixed: 1.27.0-rc.3
