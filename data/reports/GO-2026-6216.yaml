id: GO-2026-6216
modules:
    - module: codefloe.com/crowci/crow/v6
      versions:
        - fixed: 6.4.0
      vulnerable_at: 6.3.0
      packages:
        - package: codefloe.com/crowci/crow/v6/server/api
          symbols:
            - HandleAuth
        - package: codefloe.com/crowci/crow/v6/server/store/datastore
          symbols:
            - storage.GetUserRemoteID
summary: Cross-forge account takeover on login in codefloe.com/crowci/crow/v6
description: |-
    In codefloe.com/crowci/crow/v6 before 6.4.0, user account lookup during
    forge login is not scoped to the authenticating forge. An account on one forge
    matches an existing user on another forge via forge remote ID collision or
    username collision. On instances with multiple configured forges, an attacker
    can take over arbitrary Crow accounts by registering matching credentials on
    any connected forge.
credits:
    - Cassandra Beelen (sapphiccode)
references:
