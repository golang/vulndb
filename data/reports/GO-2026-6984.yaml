id: GO-2026-6984
modules:
    - module: github.com/saracen/fastzip
      versions:
        - fixed: 0.2.1
      vulnerable_at: 0.2.0
      packages:
        - package: github.com/saracen/fastzip
          symbols:
            - Extractor.createDirectory
            - Extractor.createFile
            - Extractor.createSymlink
            - Extractor.updateFileMetadata
          derived_symbols:
            - Extractor.Extract
          excluded_symbols:
            - Archiver.Archive
summary: |-
    Extractor writes outside chroot through existing symbolic link in
    github.com/saracen/fastzip
description: |-
    Extractor.Extract checks archive entry paths lexically against the destination
    chroot and then creates files, directories, and symbolic links using path-based
    os calls that follow symbolic links already present under the chroot, allowing
    writes and metadata changes outside the destination directory.
