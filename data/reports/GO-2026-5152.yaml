summary: |-
    Traefik: SNICheck ignores wildcard TLSOptions mappings in
    github.com/traefik/traefik
description: |-
    The SNICheck middleware in Traefik ignores wildcard TLSOptions mappings,
    allowing an unauthenticated attacker to bypass mTLS requirements by using a
    domain-fronted request. This occurs because the middleware compares the TLS
    options name used during the handshake with a pre-computed value that may not
    account for wildcard matches correctly when certain configuration models are
    applied.
